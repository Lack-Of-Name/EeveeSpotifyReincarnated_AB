name: Build Unsigned IPA (LiveContainer)

# Builds EeveeSpotify from source, injects it into a decrypted Spotify IPA and
# outputs an UNSIGNED IPA tuned for installation in LiveContainer:
#   - no Apple code signature / provisioning profile (ldid -S pseudo-signature)
#   - Watch app and every native .appex stripped (LiveContainer has no appex
#     support, and the guest is re-signed by LiveContainer itself)
#   - zxPluginsInject LC-injected so Spotify's hard-coded keychain access group
#     is rebound to the group LiveContainer actually grants the guest
# Optionally also emits a TweakLoader bundle for LiveContainer's Tweaks tab.
# You still supply your own decrypted Spotify IPA URL.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "Direct URL to a decrypted Spotify IPA"
        default: ""
        required: true
        type: string
      include_sideload_shim:
        description: "LC-inject zxPluginsInject (sideload compatibility shim)"
        default: true
        required: false
        type: boolean
      include_tweakloader_bundle:
        description: "Also upload a LiveContainer TweakLoader bundle (dylib + framework)"
        default: true
        required: false
        type: boolean
      upload_method:
        description: "Where to upload the unsigned IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget unzip zip file
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids the anon API rate limit.
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build tweak .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH" >> $GITHUB_ENV

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Download vanilla IPA
        run: |
          set -o pipefail
          IPA="$RUNNER_TEMP/spotify.ipa"
          URL="${{ inputs.ipa_url }}"
          echo "Downloading IPA from: ${URL}"

          # Do NOT send a browser User-Agent: filebin answers browsers with
          # its HTML page instead of the raw file. -L follows redirects,
          # -w gives us the status even when the host answers with an error.
          STATUS=$(curl -sS -L --retry 3 --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 \
              -o "$IPA" -w '%{http_code}' "$URL") || STATUS="000"

          # Accept any 2xx (200 for a full GET, 206 for a resumed/range reply).
          if [[ ! "$STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::IPA download failed (HTTP $STATUS)."
            echo "::error::Check that the link is a DIRECT download and still alive. Filebin bins expire after inactivity — re-upload and paste a fresh URL. Filenames with spaces/brackets can also cause 403s; rename the file to something simple like Spotify.ipa before uploading."
            [ -s "$IPA" ] && head -c 500 "$IPA" || true
            exit 1
          fi

          SIZE=$(stat -f%z "$IPA" 2>/dev/null || stat -c%s "$IPA" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::Downloaded file is only ${SIZE} bytes — likely an HTML error page, not an IPA."
            head -c 500 "$IPA" || true
            exit 1
          fi

          file_type=$(file --mime-type -b "$IPA")
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi
          if ! unzip -tq "$IPA" >/dev/null 2>&1; then
            echo "::error::IPA failed zip integrity check"
            exit 1
          fi
          echo "Downloaded $((SIZE / 1024 / 1024)) MB IPA."
          echo "VANILLA_IPA=$IPA" >> $GITHUB_ENV

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.include_sideload_shim }}
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Inject tweak into IPA (cyan)
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"; mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)
          [ -n "$DYLIB_SRC" ] || { echo "EeveeSpotify.dylib missing from .deb" >&2; exit 1; }

          SPOT_VERSION=$(unzip -p "$VANILLA_IPA" 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}-unsigned.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          cyan -i "$VANILLA_IPA" -o "$OUT" -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: LC-inject sideload compatibility shim
        if: ${{ inputs.include_sideload_shim }}
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
              --dylib packages/zxPluginsInject.dylib

      - name: Strip Watch app and native extensions
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "$OUT_IPA"

      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Make IPA unsigned
        run: |
          chmod +x Tools/make-unsigned-ipa.sh
          Tools/make-unsigned-ipa.sh "$OUT_IPA"

      - name: Verify LiveContainer compatibility
        run: |
          set -e
          if unzip -l "$OUT_IPA" | grep -qiE '_CodeSignature|CodeResources'; then
            echo "::error::Code signature material still present in IPA"
            exit 1
          fi
          if unzip -l "$OUT_IPA" | grep -qiE '\.appex/|/Watch/|WatchPlaceholder'; then
            echo "::error::App extensions/Watch bundles survived — LiveContainer cannot load them"
            exit 1
          fi
          unzip -p "$OUT_IPA" 'Payload/Spotify.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          plutil -lint "$RUNNER_TEMP/Info.plist"
          EXECUTABLE=$(plutil -extract CFBundleExecutable raw -o - "$RUNNER_TEMP/Info.plist")
          unzip -l "$OUT_IPA" | grep -q "Payload/Spotify.app/$EXECUTABLE"
          echo "IPA is unsigned, appex-free and structurally valid for LiveContainer."

      - name: Build LiveContainer TweakLoader bundle
        if: ${{ inputs.include_tweakloader_bundle }}
        run: |
          chmod +x Tools/build-livecontainer-tweak-bundle.sh
          ZXPI=""
          if [ "${{ inputs.include_sideload_shim }}" = "true" ]; then
            ZXPI="packages/zxPluginsInject.dylib"
          fi
          Tools/build-livecontainer-tweak-bundle.sh "$DEB_PATH" "$ZXPI"

      - name: Upload unsigned IPA artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-LiveContainer-Unsigned-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload LiveContainer TweakLoader bundle artifact
        if: ${{ inputs.include_tweakloader_bundle && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-LiveContainer-Tweaks
          path: Outputs/LiveContainerTweaks
          if-no-files-found: error

      - name: Upload unsigned IPA to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        run: |
          BIN="eevee-unsigned-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null
          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          {
            echo "### 📦 LiveContainer unsigned IPA"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Install in LiveContainer with + → IPA files. Direct injection is already in the IPA; no Tweaks-tab setup required._"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.include_tweakloader_bundle }}" = "true" ]; then
            for TWEAK in "$GITHUB_WORKSPACE/Outputs/LiveContainerTweaks/EeveeSpotify.dylib" \
                         "$GITHUB_WORKSPACE/Outputs/LiveContainerTweaks/zxPluginsInject.dylib" \
                         "$GITHUB_WORKSPACE/Outputs/LiveContainerTweaks/EeveeSwiftProtobuf.framework.zip"; do
              [ -f "$TWEAK" ] || continue
              NAME=$(basename "$TWEAK")
              curl -fsS -X POST \
                   -H "Content-Type: application/octet-stream" \
                   --data-binary "@${TWEAK}" \
                   "https://filebin.net/${BIN}/${NAME}" >/dev/null
              echo "- **TweakLoader ${NAME}:** https://filebin.net/${BIN}/${NAME}" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._" >> "$GITHUB_STEP_SUMMARY"
